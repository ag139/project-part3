# EXAMPLE ONLY - do not put real credentials here, and do not apply this file.
# Secrets are split by purpose so that each service receives only what it needs
# (least privilege): the worker gets no secrets at all, and PostgreSQL never
# sees the AWS credentials.
#
# Create the real secrets with:
#
#   kubectl create secret generic db-secrets -n devops-app \
#     --from-literal=DB_USER=app \
#     --from-literal=DB_PASSWORD='REPLACE_ME'
#
#   kubectl create secret generic aws-secrets -n devops-app \
#     --from-literal=AWS_ACCESS_KEY_ID='REPLACE_ME' \
#     --from-literal=AWS_SECRET_ACCESS_KEY='REPLACE_ME'
#
# Consumed by: backend (both), postgres (db-secrets only), worker (neither).

apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: devops-app
type: Opaque
stringData:
  DB_USER: "app"
  DB_PASSWORD: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-secrets
  namespace: devops-app
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
