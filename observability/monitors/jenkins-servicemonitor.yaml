apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jenkins-controller
  namespace: observability
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: ["jenkins"]
  selector:
    matchLabels:
      app.kubernetes.io/component: jenkins-controller
  endpoints:
    - port: http
      path: /prometheus/
      interval: 30s
      scrapeTimeout: 10s
