apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devops-app-backend
  namespace: observability
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: ["devops-app"]
  selector:
    matchLabels:
      app: devops-app
      component: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
