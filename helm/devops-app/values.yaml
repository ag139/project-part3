namespace: devops-app

image:
  registry: ""
  tag: "1.0.0"
  pullPolicy: IfNotPresent

config:
  dbHost: "database-2.ckf82kukcaf1.us-east-1.rds.amazonaws.com"
  dbPort: "5432"
  dbName: "application"
  s3Bucket: "ayelet-backend-bucket"
  snsTopicArn: "arn:aws:sns:us-east-1:184574353811:ayelet-topic"
  awsRegion: "us-east-1"

secrets:
  dbUser: "postgres"
  dbPassword: "REPLACE_ME"
  awsAccessKeyId: "REPLACE_ME"
  awsSecretAccessKey: "REPLACE_ME"

frontend:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits:   { cpu: 300m, memory: 128Mi }

backend:
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

worker:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 256Mi }

ingress:
  enabled: true
  className: nginx
  host: devops-app.local
  tls:
    enabled: false

networkPolicy:
  enabled: true
