apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{ .Values.namespace }}
data:
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  S3_BUCKET_NAME: {{ .Values.config.s3Bucket | quote }}
  SNS_TOPIC_ARN: {{ .Values.config.snsTopicArn | quote }}
  AWS_REGION: {{ .Values.config.awsRegion | quote }}
