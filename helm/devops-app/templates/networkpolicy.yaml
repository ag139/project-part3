{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels: { component: frontend }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
  egress:
    - to:
        - podSelector: { matchLabels: { component: backend } }
      ports: [{ protocol: TCP, port: 5000 }]
    - to: []
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels: { component: backend }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { component: frontend } }
      ports: [{ protocol: TCP, port: 5000 }]
  egress:
    - to: []
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 5432 }
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-worker
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels: { component: worker }
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to: []
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 5432 }
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
