apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Values.namespace }}
  labels: { app: devops-app, component: worker }
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: { app: devops-app, component: worker }
  template:
    metadata:
      labels: { app: devops-app, component: worker }
    spec:
      serviceAccountName: worker-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: "{{ .Values.image.registry }}devops-app-worker:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef: { name: app-config }
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            exec: { command: ["sh", "-c", "test -f /tmp/healthy"] }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            exec: { command: ["sh", "-c", "find /tmp/healthy -mmin -2 | grep -q healthy"] }
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
