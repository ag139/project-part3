- name: Install system packages
  become: yes
  ansible.builtin.yum:
    name:
      - python3
      - python3-pip
    state: present

- name: Install Python dependencies
  ansible.builtin.pip:
    name:
      - flask
      - boto3
      - psycopg2-binary

- name: Create app directory
  become: yes
  ansible.builtin.file:
    path: /home/ec2-user/app
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"

- name: Create Flask app
  ansible.builtin.copy:
    dest: /home/ec2-user/app/app.py
    owner: ec2-user
    group: ec2-user
    mode: "0755"
    content: |
      from flask import Flask, jsonify

      app = Flask(__name__)

      @app.route("/")
      def home():
          return "Backend is working"

      @app.route("/health")
      def health():
          return jsonify(status="ok")

      if __name__ == "__main__":
          app.run(host="0.0.0.0", port=5000)

- name: Create systemd service
  become: yes
  ansible.builtin.copy:
    dest: /etc/systemd/system/backend.service
    content: |
      [Unit]
      Description=Backend Service
      After=network.target

      [Service]
      User=ec2-user
      WorkingDirectory=/home/ec1-user/app
      ExecStart=/usr/bin/python3 /home/ec2-user/app/app.py
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd
  become: yes
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Enable and start backend
  become: yes
  ansible.builtin.systemd:
    name: backend
    enabled: yes
    state: started
