services:
  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: backend_app
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: app
      DB_PASSWORD: secret
      DB_NAME: appdb
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 5000
    depends_on:
      - db
    volumes:
      - .:/app
    restart: always

volumes:
  pg-data:
