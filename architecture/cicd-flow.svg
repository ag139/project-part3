<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#555" stroke-width="1.4"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#9a7070" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#fff"/>

  <text x="36" y="38" font-size="15" font-weight="600" fill="#222">CI and CD flow</text>
  <line x1="36" y1="50" x2="864" y2="50" stroke="#ddd" stroke-width="1"/>

  <text x="450" y="80" text-anchor="middle" font-size="11" fill="#555">git push to main</text>
  <line x1="450" y1="88" x2="450" y2="112" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- CI -->
  <rect x="36" y="112" width="828" height="132" rx="3" fill="none" stroke="#aaa" stroke-width="1"/>
  <text x="50" y="130" font-size="10" fill="#777">CI, on ci-agent</text>

  <rect x="54" y="144" width="122" height="46" rx="2" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="115" y="163" text-anchor="middle" font-size="10.5" font-weight="600" fill="#222">Checkout</text>
  <text x="115" y="178" text-anchor="middle" font-size="8.5" fill="#777">commit, branch</text>

  <rect x="192" y="144" width="122" height="46" rx="2" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="253" y="163" text-anchor="middle" font-size="10.5" font-weight="600" fill="#222">Validation</text>
  <text x="253" y="178" text-anchor="middle" font-size="8.5" fill="#777">structure, no latest</text>

  <rect x="330" y="144" width="122" height="46" rx="2" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="391" y="163" text-anchor="middle" font-size="10.5" font-weight="600" fill="#222">Lint</text>
  <text x="391" y="178" text-anchor="middle" font-size="8.5" fill="#777">syntax check</text>

  <rect x="468" y="144" width="122" height="46" rx="2" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="529" y="163" text-anchor="middle" font-size="10.5" font-weight="600" fill="#222">Tests</text>
  <text x="529" y="178" text-anchor="middle" font-size="8.5" fill="#777">junit results</text>

  <rect x="606" y="144" width="122" height="46" rx="2" fill="#fff" stroke="#555" stroke-width="1.3"/>
  <text x="667" y="163" text-anchor="middle" font-size="10.5" font-weight="600" fill="#222">Build, Push</text>
  <text x="667" y="178" text-anchor="middle" font-size="8.5" fill="#777">rootless buildkit</text>

  <rect x="744" y="144" width="102" height="46" rx="2" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="795" y="163" text-anchor="middle" font-size="10.5" font-weight="600" fill="#222">Metadata</text>
  <text x="795" y="178" text-anchor="middle" font-size="8.5" fill="#777">tag, digest</text>

  <line x1="176" y1="167" x2="190" y2="167" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="314" y1="167" x2="328" y2="167" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="452" y1="167" x2="466" y2="167" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="590" y1="167" x2="604" y2="167" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="728" y1="167" x2="742" y2="167" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

  <text x="54" y="222" font-size="9.5" fill="#999">image tag is the short git commit hash, never latest</text>

  <line x1="450" y1="244" x2="450" y2="270" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>

  <rect x="330" y="270" width="240" height="42" rx="2" fill="#fff" stroke="#555" stroke-width="1.3"/>
  <text x="450" y="288" text-anchor="middle" font-size="11.5" font-weight="600" fill="#222">container registry</text>
  <text x="450" y="304" text-anchor="middle" font-size="9" fill="#777">the only handoff between CI and CD</text>

  <line x1="450" y1="312" x2="450" y2="338" stroke="#555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="460" y="330" font-size="9" fill="#999">CI triggers CD, tag passed as a parameter</text>

  <!-- CD -->
  <rect x="36" y="338" width="828" height="110" rx="3" fill="none" stroke="#aaa" stroke-width="1"/>
  <text x="50" y="356" font-size="10" fill="#777">CD, on cd-agent</text>

  <rect x="54" y="370" width="122" height="46" rx="2" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="115" y="389" text-anchor="middle" font-size="10.5" font-weight="600" fill="#222">Input</text>
  <text x="115" y="404" text-anchor="middle" font-size="8.5" fill="#777">tag, namespace</text>

  <rect x="192" y="370" width="122" height="46" rx="2" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="253" y="389" text-anchor="middle" font-size="10.5" font-weight="600" fill="#222">Manifests</text>
  <text x="253" y="404" text-anchor="middle" font-size="8.5" fill="#777">lint, template</text>

  <rect x="330" y="370" width="122" height="46" rx="2" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="391" y="389" text-anchor="middle" font-size="10.5" font-weight="600" fill="#222">Authenticate</text>
  <text x="391" y="404" text-anchor="middle" font-size="8.5" fill="#777">in-cluster SA</text>

  <rect x="468" y="370" width="122" height="46" rx="2" fill="#fff" stroke="#555" stroke-width="1.3"/>
  <text x="529" y="389" text-anchor="middle" font-size="10.5" font-weight="600" fill="#222">Deploy</text>
  <text x="529" y="404" text-anchor="middle" font-size="8.5" fill="#777">helm upgrade</text>

  <rect x="606" y="370" width="122" height="46" rx="2" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="667" y="389" text-anchor="middle" font-size="10.5" font-weight="600" fill="#222">Rollout</text>
  <text x="667" y="404" text-anchor="middle" font-size="8.5" fill="#777">rollout status</text>

  <rect x="744" y="370" width="102" height="46" rx="2" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="795" y="389" text-anchor="middle" font-size="10.5" font-weight="600" fill="#222">Verify</text>
  <text x="795" y="404" text-anchor="middle" font-size="8.5" fill="#777">smoke test</text>

  <line x1="176" y1="393" x2="190" y2="393" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="314" y1="393" x2="328" y2="393" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="452" y1="393" x2="466" y2="393" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="590" y1="393" x2="604" y2="393" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="728" y1="393" x2="742" y2="393" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>

  <path d="M529 416 L529 432 L610 432 L610 291 L574 291" fill="none" stroke="#9a7070" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <text x="622" y="380" font-size="9" fill="#9a7070">on failure: helm rollback</text>

  <line x1="36" y1="490" x2="864" y2="490" stroke="#ddd" stroke-width="1"/>
  <text x="36" y="510" font-size="9.5" fill="#999">A failed deploy leaves the previous revision serving traffic. Both jobs are generated from Job DSL and disallow concurrent builds.</text>
</svg>
