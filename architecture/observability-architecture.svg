<svg width="900" height="640" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#555" stroke-width="1.4"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#9a7070" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="900" height="640" fill="#fff"/>

  <text x="36" y="38" font-size="15" font-weight="600" fill="#222">Observability layer</text>
  <line x1="36" y1="50" x2="864" y2="50" stroke="#ddd" stroke-width="1"/>

  <!-- sources -->
  <rect x="36" y="74" width="240" height="300" rx="3" fill="none" stroke="#aaa" stroke-width="1"/>
  <text x="50" y="92" font-size="10" fill="#777">scrape sources</text>

  <rect x="54" y="106" width="204" height="76" rx="2" fill="#fff" stroke="#555" stroke-width="1.3"/>
  <text x="156" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#222">application</text>
  <text x="156" y="143" text-anchor="middle" font-size="9.5" fill="#777">/metrics on port 5000</text>
  <text x="156" y="157" text-anchor="middle" font-size="9.5" fill="#777">counters, histogram, gauge</text>
  <text x="156" y="171" text-anchor="middle" font-size="9.5" fill="#777">app_info, business metrics</text>

  <rect x="54" y="196" width="204" height="62" rx="2" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="156" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#222">kubernetes</text>
  <text x="156" y="233" text-anchor="middle" font-size="9.5" fill="#777">kube-state-metrics</text>
  <text x="156" y="247" text-anchor="middle" font-size="9.5" fill="#777">node-exporter, kubelet</text>

  <rect x="54" y="272" width="204" height="62" rx="2" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="156" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#222">jenkins</text>
  <text x="156" y="309" text-anchor="middle" font-size="9.5" fill="#777">/prometheus/ on port 8080</text>
  <text x="156" y="323" text-anchor="middle" font-size="9.5" fill="#777">queue, executors, builds</text>

  <text x="54" y="356" font-size="9.5" fill="#999">ServiceMonitors select these by label</text>

  <!-- prometheus -->
  <line x1="276" y1="144" x2="326" y2="200" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="276" y1="227" x2="326" y2="220" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="276" y1="303" x2="326" y2="240" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>

  <rect x="328" y="160" width="200" height="120" rx="2" fill="#fff" stroke="#555" stroke-width="1.3"/>
  <text x="428" y="182" text-anchor="middle" font-size="12.5" font-weight="600" fill="#222">Prometheus</text>
  <text x="428" y="200" text-anchor="middle" font-size="9.5" fill="#777">scrape every 30s</text>
  <text x="428" y="214" text-anchor="middle" font-size="9.5" fill="#777">7 day retention, own PVC</text>
  <line x1="344" y1="224" x2="512" y2="224" stroke="#eee" stroke-width="1"/>
  <text x="428" y="240" text-anchor="middle" font-size="9.5" fill="#777">4 recording rules (SLI)</text>
  <text x="428" y="254" text-anchor="middle" font-size="9.5" fill="#777">6 alert rules</text>
  <text x="428" y="268" text-anchor="middle" font-size="9.5" fill="#777">selector: release=monitoring</text>

  <!-- grafana -->
  <line x1="528" y1="196" x2="580" y2="150" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="582" y="106" width="200" height="90" rx="2" fill="#fff" stroke="#555" stroke-width="1.3"/>
  <text x="682" y="128" text-anchor="middle" font-size="12.5" font-weight="600" fill="#222">Grafana</text>
  <text x="682" y="146" text-anchor="middle" font-size="9.5" fill="#777">Application Overview</text>
  <text x="682" y="160" text-anchor="middle" font-size="9.5" fill="#777">Kubernetes / Cluster</text>
  <text x="682" y="174" text-anchor="middle" font-size="9.5" fill="#777">Jenkins &amp; Delivery</text>
  <text x="682" y="188" text-anchor="middle" font-size="9" fill="#999">provisioned from JSON in Git</text>

  <!-- alertmanager -->
  <line x1="528" y1="244" x2="580" y2="248" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <rect x="582" y="216" width="200" height="66" rx="2" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="682" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Alertmanager</text>
  <text x="682" y="255" text-anchor="middle" font-size="9.5" fill="#777">grouping, inhibition</text>
  <text x="682" y="269" text-anchor="middle" font-size="9.5" fill="#777">routed by severity</text>

  <!-- CD gate -->
  <rect x="328" y="330" width="454" height="96" rx="3" fill="#faf7f0" stroke="#b09a68" stroke-width="1"/>
  <text x="344" y="352" font-size="12" font-weight="600" fill="#6b5a2e">CD monitoring gate</text>
  <text x="344" y="370" font-size="9.5" fill="#6b5a2e">after rollout and smoke test, the pipeline queries Prometheus:</text>
  <text x="344" y="387" font-size="9.5" fill="#6b5a2e">all scrape targets up, error ratio under 5 percent, p95 under 1 second</text>
  <text x="344" y="404" font-size="9.5" fill="#6b5a2e">a release that fails any check is marked unhealthy and the rollback command is printed</text>
  <text x="344" y="418" font-size="9" fill="#8a7a4e">Running is not the same as serving correctly</text>

  <path d="M428 280 L428 328" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="436" y="308" font-size="9" fill="#999">query</text>

  <path d="M330 378 L200 378 L200 190" fill="none" stroke="#9a7070" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#r)"/>
  <text x="206" y="290" font-size="9" fill="#9a7070">rollback on failure</text>

  <!-- as code -->
  <rect x="36" y="450" width="746" height="86" rx="3" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="50" y="470" font-size="10.5" font-weight="600" fill="#6b6960">everything as code</text>
  <text x="50" y="490" font-size="9.5" fill="#777">helm values, ServiceMonitors, PrometheusRules, dashboard JSON, runbooks and network policies all live in Git.</text>
  <text x="50" y="506" font-size="9.5" fill="#777">CI validates every one of these files before a build runs; nothing is created through the Grafana interface.</text>
  <text x="50" y="522" font-size="9.5" fill="#777">A rebuilt cluster reaches the same state by running one script.</text>

  <line x1="36" y1="566" x2="864" y2="566" stroke="#ddd" stroke-width="1"/>
  <text x="36" y="586" font-size="9.5" fill="#999">From one commit: image tag, running pod, the version panel on the dashboard, and the alert that fires if the release hurts users.</text>
  <text x="36" y="602" font-size="9.5" fill="#999">Prometheus also monitors its own scrape targets, because an alert that cannot fire is worse than no alert at all.</text>
</svg>
