controller:
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: 2.504.3-lts-jdk17
  installPlugins:
  - kubernetes
  - workflow-aggregator
  - git
  - configuration-as-code
  - job-dsl
  - credentials-binding
  - pipeline-stage-view
  - junit
  - timestamper
  - ws-cleanup
  - github
  - kubernetes-credentials-provider
  installLatestPlugins: true
  installLatestSpecifiedPlugins: true
  serviceAccount:
    create: false
    name: jenkins-controller
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  probes:
    startupProbe:
      failureThreshold: 30
      periodSeconds: 10
    livenessProbe:
      failureThreshold: 5
      periodSeconds: 10
      timeoutSeconds: 5
    readinessProbe:
      failureThreshold: 3
      periodSeconds: 10
      timeoutSeconds: 5
  serviceType: ClusterIP
  servicePort: 8080
  JCasC:
    defaultConfig: true
    configScripts:
      welcome: "jenkins:\n  systemMessage: \"Managed by Configuration as Code. Do\
        \ not configure through the UI.\"\n"
      seed-job: "jobs:\n  - script: >\n      job('seed-job') {\n        description('Creates\
        \ the CI and CD jobs from Job DSL in the repository.')\n        scm {\n  \
        \        git {\n            remote { url('https://github.com/ag139/project-part3.git')\
        \ }\n            branch('*/main')\n          }\n        }\n        steps {\n\
        \          dsl {\n            external('jenkins/jobs/seed.groovy')\n     \
        \       removeAction('DELETE')\n          }\n        }\n      }\n"
      job-dsl-security: "security:\n  globalJobDslSecurityConfiguration:\n    useScriptSecurity:\
        \ false\n"
persistence:
  enabled: true
  size: 8Gi
  storageClass: standard
serviceAccount:
  create: false
  name: jenkins-controller
agent:
  enabled: true
  podName: default
  namespace: jenkins
  idleMinutes: 0
  podRetention: Never
  runAsUser: 1000
  runAsGroup: 1000
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
additionalAgents:
  ci:
    podName: ci-agent
    customJenkinsLabels: ci-agent
    serviceAccount: jenkins-ci
    idleMinutes: 0
    podRetention: Never
    runAsUser: 1000
    runAsGroup: 1000
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    additionalContainers:
    - sideContainerName: buildkit
      image:
        repository: moby/buildkit
        tag: v0.18.2-rootless
      command: rootlesskit
      args: buildkitd --oci-worker-no-process-sandbox --addr unix:///home/user/.local/share/buildkit/buildkitd.sock
      privileged: false
      resources:
        requests:
          cpu: 300m
          memory: 1Gi
        limits:
          cpu: '2'
          memory: 2Gi
    - sideContainerName: python
      image:
        repository: python
        tag: 3.12-slim
      command: sleep
      args: infinity
      privileged: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    - sideContainerName: trivy
      image:
        repository: aquasec/trivy
        tag: 0.58.1
      command: sleep
      args: infinity
      privileged: false
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
  cd:
    podName: cd-agent
    customJenkinsLabels: cd-agent
    serviceAccount: jenkins-cd
    idleMinutes: 0
    podRetention: Never
    runAsUser: 1000
    runAsGroup: 1000
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    additionalContainers:
    - sideContainerName: tools
      image:
        repository: alpine/k8s
        tag: 1.30.0
      command: sleep
      args: infinity
      privileged: false
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
