apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: jenkins
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-controller
  namespace: jenkins
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: jenkins-controller
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 50000 }
    - from: []
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agents
  namespace: jenkins
spec:
  podSelector:
    matchLabels:
      jenkins/jenkins-jenkins-agent: "true"
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to: []
