# Exposes only the GitHub webhook endpoint, not the Jenkins UI.
#
# During development a tunnel pointed at the whole controller service, which
# put the entire UI on a public URL. This Ingress narrows the public surface
# to the single path GitHub posts to. The UI remains reachable only through
# kubectl port-forward.
#
# Point the tunnel at the ingress controller rather than at svc/jenkins:
#   ngrok http 80
# and set the GitHub webhook to <tunnel>/github-webhook/
#
# Note: a configuration-snippet restricting the request method to POST was the
# original intent, but this ingress-nginx installation disables snippets by
# default, which is the safer posture. Path scoping alone still removes the UI
# from the public surface.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins-webhook
  namespace: jenkins
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /github-webhook/
            pathType: Exact
            backend:
              service:
                name: jenkins
                port:
                  number: 8080
