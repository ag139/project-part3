# EXAMPLE ONLY. Do not apply this file and do not put real values in it.
#
# The real secret is created imperatively so its values never reach a file:
#
#   kubectl create secret generic dockerhub-creds -n jenkins \
#     --from-literal=username="$DOCKERHUB_USER" \
#     --from-literal=password="$DOCKERHUB_TOKEN"
#
#   kubectl label secret dockerhub-creds -n jenkins \
#     "jenkins.io/credentials-type=usernamePassword"
#
# The label is what makes the kubernetes-credentials-provider plugin expose
# it inside Jenkins as a credential with the id dockerhub-creds.
#
# Token rotation:
#   1. Create a new access token in Docker Hub with Read & Write scope.
#   2. Re-run the two commands above with the new value.
#   3. Revoke the previous token in Docker Hub.
# Jenkins picks up the change without a restart, since the plugin watches
# the secret.

apiVersion: v1
kind: Secret
metadata:
  name: dockerhub-creds
  namespace: jenkins
  labels:
    jenkins.io/credentials-type: usernamePassword
  annotations:
    jenkins.io/credentials-description: Docker Hub push credentials
type: Opaque
stringData:
  username: REPLACE_ME
  password: REPLACE_ME
