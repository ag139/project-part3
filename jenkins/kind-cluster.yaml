# Multi-node local cluster, as required for an on-premise style submission.
# One control plane plus two workers, so the Jenkins controller and the
# ephemeral agent pods can be observed running on different nodes.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devops-ci
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
